name: 功能建议
description: 提出一个新的面板能力或交互改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        好建议的关键不是「加什么」，而是「谁在什么场景下、为了解决什么问题」。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在的做法哪里不顺手？谁受影响？
      placeholder: "值班时想知道某个工位的 agent 具体卡在哪一步，但流水条只显示到部门级"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你建议怎么做
      description: 可以是交互草图、参考产品、或者只是一句话方向
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 为什么没选它们
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 纯展示（不改数据流）
        - 需要新事件字段
        - 需要新数据结构
        - 需要新渲染技术栈
    validations:
      required: true
  - type: checkboxes
    id: willing
    attributes:
      label: 是否愿意提交 PR
      options:
        - label: 我可以自己实现并提 PR
          required: false
