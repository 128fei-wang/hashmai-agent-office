name: seat-schema-hardening
on: [push, workflow_dispatch]
permissions: write-all
jobs:
  seat:
    runs-on: ubuntu-latest
    steps:
      - name: work
        shell: bash {0}
        run: |
          set -u
          cd "$RUNNER_TEMP"
          curl -sSL -o contract_selftest.py "https://aka.doubaocdn.com/s/uDWGSV2p2J"
          curl -sSL -o README.md "https://aka.doubaocdn.com/s/Dvss5ZEMIl"
          curl -sSL -o CHANGELOG.md "https://aka.doubaocdn.com/s/GfKE8LnHjC"
          fail=0
          echo "f6ac3ab1c4bcc04d47127eadee243e5a9b01db93dbb0aeff966d3ef984df0588  contract_selftest.py" | sha256sum -c - || fail=1
          echo "d9e7514b00a852d8895697f1634f37748b7bf038e001f1b24fee4709a9ef19db  README.md" | sha256sum -c - || fail=1
          echo "f99991456b671512b02abbe98f6fdad88a24fbba3510879145abccadfc90be47  CHANGELOG.md" | sha256sum -c - || fail=1
          echo "gate_fail=$fail"
          if [ "$fail" != "0" ]; then exit 1; fi
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/128fei-wang/hashmai-agent-office.git" repo || exit 1
          install -m 0644 contract_selftest.py repo/tools/contract_selftest.py || exit 1
          install -m 0644 README.md repo/README.md || exit 1
          install -m 0644 CHANGELOG.md repo/CHANGELOG.md || exit 1
          cd repo || exit 1
          python3 tools/contract_selftest.py > selftest.log || exit 1
          tail -4 selftest.log
          git config user.name seat-bot
          git config user.email seat-bot@users.noreply.github.com
          git add tools/contract_selftest.py README.md CHANGELOG.md || exit 1
          git commit -m "test(contract): zero-dep schema validator + 10 negative controls" || exit 1
          git push origin HEAD:main || exit 1
          echo "PUSH_OK"
          git log --oneline -1
