name: seat-schema-hardening
on: [push, workflow_dispatch]
permissions: write-all
jobs:
  seat:
    runs-on: ubuntu-latest
    steps:
      - name: work
        shell: bash {0}
        run: |
          exec > >(tee "$RUNNER_TEMP/run.log") 2>&1
          set -x
          cd "$RUNNER_TEMP"
          curl -sSL -o contract_selftest.py "https://aka.doubaocdn.com/s/uDWGSV2p2J"; echo "curl1=$?"
          curl -sSL -o README.md "https://aka.doubaocdn.com/s/Dvss5ZEMIl"; echo "curl2=$?"
          curl -sSL -o CHANGELOG.md "https://aka.doubaocdn.com/s/GfKE8LnHjC"; echo "curl3=$?"
          curl -sSL -o ci.yml "https://aka.doubaocdn.com/s/nTlR3kheQA"; echo "curl4=$?"
          ls -l contract_selftest.py README.md CHANGELOG.md ci.yml
          sha256sum contract_selftest.py README.md CHANGELOG.md ci.yml
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/128fei-wang/hashmai-agent-office.git" repo; echo "clone=$?"
          ls repo | head
          install -m 0644 contract_selftest.py repo/tools/contract_selftest.py; echo "inst1=$?"
          install -m 0644 README.md repo/README.md
          install -m 0644 CHANGELOG.md repo/CHANGELOG.md
          install -m 0644 ci.yml repo/.github/workflows/ci.yml
          cd repo || exit 1
          git config user.name seat-bot
          git config user.email seat-bot@users.noreply.github.com
          git status --short
          git add -A tools/contract_selftest.py README.md CHANGELOG.md .github/workflows/ci.yml; echo "add=$?"
          git commit -m "test(contract): zero-dep schema validator + 10 negative controls"; echo "commit=$?"
          git push origin HEAD:main; echo "push=$?"
          git log --oneline -1
      - name: report
        if: always()
        shell: bash {0}
        run: |
          LOG=$(tail -c 3000 "$RUNNER_TEMP/run.log" | python3 -c "import json,sys;print(json.dumps(sys.stdin.read()))")
          curl -sS -X POST -H "Authorization: token ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            -d "{\"title\":\"seat-schema-hardening diag $(date -u +%H%M%S)\",\"body\":$LOG}" \
            "https://api.github.com/repos/128fei-wang/hashmai-agent-office/issues" | head -c 200
