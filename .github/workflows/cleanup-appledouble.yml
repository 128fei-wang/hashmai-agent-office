name: cleanup-appledouble
on: push
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: remove apple double junk
        run: |
          set +e
          find . -name '._*' -not -path './.git/*' -print -delete | head -40
          grep -q 'apple double' .gitignore || printf '\n# macOS 打包副产物（AppleDouble）\n._*\n' >> .gitignore
          git config user.name "hashmai-agent"
          git config user.email "agent@users.noreply.github.com"
          git add -A
          git status --short | head -40
          if git diff --cached --quiet; then echo NO_CHANGES; exit 0; fi
          git commit -m "chore: 清理 macOS 打包带出的 AppleDouble 文件，.gitignore 加 ._*"
          git push origin HEAD:main; exit $?
