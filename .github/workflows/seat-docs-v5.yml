name: seat-docs-v5
on: [push, workflow_dispatch]
permissions: write-all
jobs:
  seat:
    runs-on: ubuntu-latest
    steps:
      - name: fetch-install-push
        shell: bash {0}
        run: |
          set -u
          cd "$RUNNER_TEMP"
          curl -sSL -o CONTRACT-01.md "https://aka.doubaocdn.com/s/V9wPdy3Qi7"
          curl -sSL -o verify.sh "https://aka.doubaocdn.com/s/DOZns43hgC"
          echo "b26661aecca78b0b57f00f6820bc8b398935a7299aeebca3b580fd68aef3dece  CONTRACT-01.md" > sums.txt
          echo "e1ec6dac73fcd722a6e2f500ca354d40be770955f1808b039be354207fd686d4  verify.sh" >> sums.txt
          sha256sum -c sums.txt
          gate=$?
          echo "gate_rc=$gate"
          if [ "$gate" != "0" ]; then echo "GATE FAILED"; exit 0; fi
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/128fei-wang/hashmai-agent-office.git" repo
          install -m 0644 CONTRACT-01.md repo/CONTRACT-01.md
          install -m 0755 verify.sh repo/verify.sh
          cd repo
          git config user.name seat-bot
          git config user.email seat-bot@users.noreply.github.com
          git add CONTRACT-01.md verify.sh
          git commit -m "docs: CONTRACT-01.md -> b26661ae (8342 B); verify.sh v2 (P98 required)"
          crc=$?
          echo "commit_rc=$crc"
          git push origin HEAD:main
          echo "push_rc=$?"
