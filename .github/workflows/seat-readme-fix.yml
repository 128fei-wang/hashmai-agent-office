name: seat-readme-fix
on: [push, workflow_dispatch]
permissions: write-all
jobs:
  seat:
    runs-on: ubuntu-latest
    steps:
      - name: fetch-install-push
        shell: bash {0}
        run: |
          set -u
          cd "$RUNNER_TEMP"
          curl -sSL -o README.md "https://aka.doubaocdn.com/s/CHEPIVYnYJ"
          echo "57dc8d4a7534afb991df56d56de4afc3ce8f336eb13d797e361a688e09dfb1f9  README.md" > sums.txt
          sha256sum -c sums.txt
          gate=$?
          echo "gate_rc=$gate"
          if [ "$gate" != "0" ]; then exit 0; fi
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/128fei-wang/hashmai-agent-office.git" repo
          install -m 0644 README.md repo/README.md
          cd repo
          git config user.name seat-bot
          git config user.email seat-bot@users.noreply.github.com
          git add README.md
          git commit -m "docs(README): fix D6 evidence link (D6-FPS-EVIDENCE.md); label 0.14 ms render cost as historical baseline"
          echo "commit_rc=$?"
          git push origin HEAD:main
          echo "push_rc=$?"
