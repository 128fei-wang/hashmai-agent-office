name: rename-apply
on: push
permissions:
  contents: write
  issues: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply rename tree
        run: |
          set +e
          exec > >(tee /tmp/run.log) 2>&1
          echo "[1] download"
          curl -sSL -o /tmp/tree.tgz "https://aka.doubaocdn.com/s/0vAqukFlEW"; echo "curl_rc=$?"
          ls -l /tmp/tree.tgz | head -1
          echo "[2] untar"
          mkdir -p /tmp/tree && tar xzf /tmp/tree.tgz -C /tmp/tree 2>/dev/null; echo "untar_rc=$?"
          echo "files=$(find /tmp/tree -type f | wc -l)"
          echo "[3] overlay"
          rsync -a --delete --exclude .git --exclude ".github/workflows" /tmp/tree/ ./; echo "rsync_rc=$?"
          git config user.name "hashmai-agent"
          git config user.email "agent@users.noreply.github.com"
          git add -A
          echo "[4] changes"
          git status --short | head -40
          if git diff --cached --quiet; then echo "NO_CHANGES"; exit 3; fi
          git commit -m "rename: 对外名定为 RoostOffice（页面/README/package 同步，契约 5/6 拆两棵树，移除 PATCH-04-NAME）"
          echo "[5] main tip before push: $(git rev-parse HEAD)"
          git push origin HEAD:main; PUSH=$?
          echo "push_rc=$PUSH"
          exit $PUSH
      - name: report failure
        if: failure()
        run: |
          set +e
          head -c 7000 /tmp/run.log > /tmp/body.txt
          python3 - <<'PY'
          import json, os, urllib.request
          log = open('/tmp/body.txt', encoding='utf-8', errors='replace').read()
          tok = os.environ['GITHUB_TOKEN']
          data = json.dumps({"title": "rename-apply log", "body": "```\n" + log + "\n```"}, ensure_ascii=False).encode()
          req = urllib.request.Request("https://api.github.com/repos/128fei-wang/hashmai-agent-office/issues", data=data, headers={"Authorization": "Bearer " + tok, "Accept": "application/vnd.github+json"})
          print(urllib.request.urlopen(req).status)
          PY
