name: admin-issue-redact
on:
  push:
    paths:
      - '.github/workflows/admin-issue-redact.yml'
  workflow_dispatch:

permissions: write-all

jobs:
  redact:
    runs-on: ubuntu-latest
    steps:
      - name: Run redaction script
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCRIPT_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$SCRIPT_B64" | base64 -d > /tmp/s.py
          python3 /tmp/s.py || echo "python_rc=$?"
