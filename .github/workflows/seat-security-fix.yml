name: seat-security-fix
on: [push, workflow_dispatch]
permissions: write-all
jobs:
  seat:
    runs-on: ubuntu-latest
    steps:
      - name: fetch-install-push
        shell: bash {0}
        run: |
          set -u
          cd "$RUNNER_TEMP"
          curl -sSL -o SECURITY.md "https://aka.doubaocdn.com/s/DgOYVvuNC3"
          echo "43d3f2a7e0d32c66a7094a87e179d05024710df24ee7dd9db01eac61bd769b42  SECURITY.md" > sums.txt
          sha256sum -c sums.txt
          gate=$?
          echo "gate_rc=$gate"
          if [ "$gate" != "0" ]; then exit 0; fi
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/128fei-wang/hashmai-agent-office.git" repo
          install -m 0644 SECURITY.md repo/SECURITY.md
          cd repo
          git config user.name seat-bot
          git config user.email seat-bot@users.noreply.github.com
          git add SECURITY.md
          git commit -m "docs(SECURITY): fix D6 evidence link target"
          echo "commit_rc=$?"
          git push origin HEAD:main
          echo "push_rc=$?"
