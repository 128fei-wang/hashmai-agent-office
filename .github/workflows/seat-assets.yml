name: seat-assets

on:
  push:
    paths:
      - .github/workflows/seat-assets.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  seat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch and verify bytes
        run: |
          set -euo pipefail
          curl -sSL --retry 2 -o /tmp/c.md  https://aka.doubaocdn.com/s/H40TrdgUpA
          curl -sSL --retry 2 -o /tmp/a.png https://aka.doubaocdn.com/s/reBR2bnjQw
          curl -sSL --retry 2 -o /tmp/t.png https://aka.doubaocdn.com/s/zJRdMDndnr
          echo "b7aebb9d78c2a498f6f453d5aa240e07aa867c7b3afe4a4f29ffdbdc1ccd5686  /tmp/c.md"  | sha256sum -c -
          echo "00a53ec70e3f14a4e2e5b2dfe72530df8ef7096a6c92413f07fa0013c820ed45  /tmp/a.png" | sha256sum -c -
          echo "14ee93dbab95a7c12f118fc8ae09b6f663be007ac9805d9d182c464f2230646f  /tmp/t.png" | sha256sum -c -
          install -m 0644 /tmp/c.md  CONTRACT-01.md
          install -m 0644 /tmp/a.png assets/agents.png
          install -m 0644 /tmp/t.png assets/office-tileset.png
          wc -c CONTRACT-01.md assets/agents.png assets/office-tileset.png

      - name: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec 2>&1
          git config user.name "roost-seat-bot"
          git config user.email "128fei-wang@users.noreply.github.com"
          git add CONTRACT-01.md assets/agents.png assets/office-tileset.png
          git diff --cached --stat
          git commit -m "seat: CONTRACT-01.md -> b7aebb9d (8268 B); add assets/agents.png + assets/office-tileset.png (sha256 verified)" || echo "commit-failed-or-empty"
          rc=0
          if git push origin HEAD:main; then rc=0; else rc=$?; fi
          echo "--- push rc=$rc"
          {
            echo "seat-assets push rc=$rc"
            echo
            echo '```'
            git status --short
            git log --oneline -2
            echo '```'
          } > /tmp/body.md
          jq -n --arg t "seat-assets diag rc=$rc" --arg b "$(cat /tmp/body.md)" '{title:$t,body:$b}' > /tmp/issue.json
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/128fei-wang/hashmai-agent-office/issues -d @/tmp/issue.json -o /tmp/resp.json || true
          head -c 400 /tmp/resp.json || true
          exit $rc
